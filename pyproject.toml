[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-availability"
version = "0.1.0"
description = "Python client for the Streaming Availability API (movieofthenight.com)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name" },
]
keywords = ["streaming", "netflix", "movies", "tv", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.27",
]

[project.optional-dependencies]
async = ["httpx>=0.23"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "responses>=0.23",
    "respx>=0.20",
    "httpx>=0.23",
]

[project.urls]
Homepage = "https://github.com/yourname/streaming-availability-python"
"API Docs" = "https://docs.movieofthenight.com"

[tool.setuptools.packages.find]
include = ["streaming_availability*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
